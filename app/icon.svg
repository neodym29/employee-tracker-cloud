<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Neo-Nexus">
  <style>
    :root { color: #27252a; }
    @media (prefers-color-scheme: dark) { :root { color: #f4f3ef; } }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: no-preference) {
      .outer { transform-origin: 32px 32px; animation: orbit 24s linear infinite; }
      .inner { transform-origin: 32px 32px; animation: orbit 15s linear infinite reverse; }
    }
  </style>
  <circle cx="32" cy="32" r="26" fill="none" stroke="currentColor" stroke-width="3" opacity=".24"/>
  <circle class="outer" cx="32" cy="32" r="26" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-dasharray="100 64" opacity=".7"/>
  <circle class="inner" cx="32" cy="32" r="17" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-dasharray="79 28"/>
  <circle cx="32" cy="32" r="5.5" fill="currentColor"/>
</svg>
