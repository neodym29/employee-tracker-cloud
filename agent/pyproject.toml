[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "employee-tracker"
version = "0.1.0"
description = "Transparent Ubuntu background activity logger with workspace file activity tracking"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10",
    "pyautogui>=0.9.54",
    "evdev>=1.7; sys_platform == 'linux'",
]

[project.scripts]
employee-tracker = "employee_tracker.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
